<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geocodificador de CEP - Andra</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        #map { height: 350px; width: 100%; border-radius: 0.5rem; z-index: 1; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen p-8 font-sans">
    <div class="max-w-5xl mx-auto bg-white rounded-xl shadow-lg overflow-hidden">
        <div class="p-8 text-center border-b border-gray-100">
            <img src="https://fluig.andra.com.br/volume/stream/Rmx1aWc=/P3Q9MSZ2b2w9RGVmYXVsdCZpZD04NTI3JnZlcj0xMDAwJmZpbGU9QU5EUkErJTI4MSUyOS5wbmcmY3JjPTE2OTA1NzMxMTQmc2l6ZT0wLjAzODc3NCZ1SWQ9MjgmZlNJZD0xJnVTSWQ9MSZkPWZhbHNlJnRrbj0mcHVibGljVXJsPXRydWUmYXR0YWNoPWZhbHNl.png" alt="Logo Andra" class="h-16 mx-auto mb-4">
            <h1 class="text-3xl font-bold text-gray-800">Geocodificador de CEP</h1>
            <p class="text-gray-500 mt-2">Insira uma lista de CEPs separados por vírgula ou por linha.</p>
        </div>

        <div class="p-8 grid grid-cols-1 md:grid-cols-2 gap-8">
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2">Lista de CEPs</label>
                <textarea id="cepInput" rows="6" class="w-full p-4 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition" placeholder="Ex: 02925-160, 01001-000"></textarea>
                
                <div class="mt-4 flex gap-4">
                    <button id="btnBuscar" onclick="iniciarBusca()" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-lg transition duration-200">
                        Buscar Coordenadas
                    </button>
                    <button id="btnExportar" onclick="exportarCSV()" class="hidden bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-6 rounded-lg transition duration-200">
                        Exportar CSV
                    </button>
                </div>
            </div>
            <div id="map-container" class="hidden">
                <div id="map" class="shadow-inner border border-gray-200"></div>
            </div>
        </div>

        <div class="p-8 bg-gray-50 border-t border-gray-100">
            <h2 class="text-xl font-bold text-gray-800 mb-4">Resultados</h2>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse" id="resultadosTable">
                    <thead>
                        <tr class="text-sm text-gray-600 border-b border-gray-300">
                            <th class="pb-3 pr-4 font-semibold">CEP</th>
                            <th class="pb-3 pr-4 font-semibold">Endereço Encontrado</th>
                            <th class="pb-3 pr-4 font-semibold">Latitude</th>
                            <th class="pb-3 pr-4 font-semibold">Longitude</th>
                            <th class="pb-3 font-semibold text-right">Status</th>
                        </tr>
                    </thead>
                    <tbody id="tabelaCorpo" class="text-sm">
                        <tr>
                            <td colspan="5" class="py-8 text-center text-gray-400">Nenhuma busca realizada.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        let map;
        let markers = [];
        let mapBounds;

        function initMap() {
            if (!map) {
                document.getElementById('map-container').classList.remove('hidden');
                map = L.map('map').setView([-14.2350, -51.9253], 4); 
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    attribution: '© OpenStreetMap contributors'
                }).addTo(map);
            }
            // Limpa marcadores anteriores
            markers.forEach(m => map.removeLayer(m));
            markers = [];
            mapBounds = L.latLngBounds();
        }

        const sleep = ms => new Promise(r => setTimeout(r, ms));

        async function iniciarBusca() {
            const input = document.getElementById('cepInput').value;
            const ceps = input.replace(/[\n\r]/g, ',').split(',').map(c => c.trim().replace(/\D/g, '')).filter(c => c.length === 8);
            
            const tbody = document.getElementById('tabelaCorpo');
            const btnBuscar = document.getElementById('btnBuscar');
            const btnExportar = document.getElementById('btnExportar');

            if (ceps.length === 0) {
                alert("Insira pelo menos um CEP válido.");
                return;
            }

            btnBuscar.disabled = true;
            btnBuscar.classList.add('opacity-50', 'cursor-not-allowed');
            btnBuscar.innerText = "Processando...";
            btnExportar.classList.add('hidden');
            tbody.innerHTML = '';
            initMap();

            for (let cep of ceps) {
                const tr = document.createElement('tr');
                tr.id = `row-${cep}`;
                tr.className = "border-b border-gray-200 hover:bg-gray-100 transition";
                tr.innerHTML = `
                    <td class="py-3 pr-4 font-medium">${cep}</td>
                    <td class="py-3 pr-4 text-gray-500" id="end-${cep}">-</td>
                    <td class="py-3 pr-4 text-gray-500" id="lat-${cep}">-</td>
                    <td class="py-3 pr-4 text-gray-500" id="lon-${cep}">-</td>
                    <td class="py-3 text-right">
                        <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-blue-100 text-blue-800" id="status-${cep}">
                            Aguardando...
                        </span>
                    </td>
                `;
                tbody.appendChild(tr);
            }

            for (let i = 0; i < ceps.length; i++) {
                const cep = ceps[i];
                await processarCEP(cep);
                if (i < ceps.length - 1) {
                    await sleep(1200); 
                }
            }

            btnBuscar.disabled = false;
            btnBuscar.classList.remove('opacity-50', 'cursor-not-allowed');
            btnBuscar.innerText = "Buscar Coordenadas";
            btnExportar.classList.remove('hidden');
        }

        async function processarCEP(cep) {
            const statusBadge = document.getElementById(`status-${cep}`);
            const latCell = document.getElementById(`lat-${cep}`);
            const lonCell = document.getElementById(`lon-${cep}`);
            const endCell = document.getElementById(`end-${cep}`);

            try {
                statusBadge.className = "inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-yellow-100 text-yellow-800";
                statusBadge.innerText = "Buscando ViaCEP...";

                const viaCepRes = await fetch(`https://viacep.com.br/ws/${cep}/json/`);
                const viaCepData = await viaCepRes.json();

                if (viaCepData.erro) throw new Error("CEP não existe");

                const enderecoCompleto = `${viaCepData.logradouro}, ${viaCepData.bairro}, ${viaCepData.localidade}, ${viaCepData.uf}`;
                endCell.innerText = enderecoCompleto;

                statusBadge.innerText = "Buscando Mapa...";

                // SOLUÇÃO: Query estruturada e hiper-específica + countrycodes=br para evitar ambiguidades
                const queryNominatim = `${enderecoCompleto}, Brasil`;
                const nominatimUrl = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(queryNominatim)}&countrycodes=br&limit=1`;
                
                const nomRes = await fetch(nominatimUrl);
                const nomData = await nomRes.json();

                if (nomData.length > 0) {
                    const lat = parseFloat(nomData[0].lat).toFixed(6);
                    const lon = parseFloat(nomData[0].lon).toFixed(6);
                    
                    latCell.innerText = lat;
                    lonCell.innerText = lon;
                    latCell.classList.replace('text-gray-500', 'text-gray-900');
                    lonCell.classList.replace('text-gray-500', 'text-gray-900');

                    statusBadge.className = "inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-green-100 text-green-800";
                    statusBadge.innerText = "Sucesso";

                    const marker = L.marker([lat, lon]).addTo(map).bindPopup(`<b>${cep}</b><br>${enderecoCompleto}`);
                    markers.push(marker);
                    mapBounds.extend([lat, lon]);
                    map.fitBounds(mapBounds, { padding: [30, 30], maxZoom: 15 });
                    
                } else {
                    throw new Error("Coordenada não encontrada");
                }

            } catch (error) {
                statusBadge.className = "inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-red-100 text-red-800";
                statusBadge.innerText = error.message === "CEP não existe" ? "CEP Inválido" : "Erro no Mapa";
            }
        }

        function exportarCSV() {
            let csv = "CEP,Endereco,Latitude,Longitude,Status\n";
            const linhas = document.querySelectorAll("#tabelaCorpo tr");
            
            linhas.forEach(linha => {
                const cols = linha.querySelectorAll("td");
                if(cols.length === 5) {
                    const cep = cols[0].innerText;
                    const end = `"${cols[1].innerText}"`; 
                    const lat = cols[2].innerText;
                    const lon = cols[3].innerText;
                    const status = cols[4].innerText.trim();
                    csv += `${cep},${end},${lat},${lon},${status}\n`;
                }
            });

            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            const url = URL.createObjectURL(blob);
            link.setAttribute("href", url);
            link.setAttribute("download", "coordenadas_ceps.csv");
            link.style.visibility = 'hidden';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
</html>
