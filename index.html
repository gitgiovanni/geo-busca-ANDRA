<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscador de Coordenadas por CEP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6; /* Gray-100 */
        }
        
        /* Custom scrollbar para a tabela */
        .table-container::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        .table-container::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 4px;
        }
        .table-container::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        .table-container::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body class="min-h-screen text-slate-800 flex flex-col items-center py-10 px-4 sm:px-6 lg:px-8">

    <main class="w-full max-w-5xl bg-white rounded-2xl shadow-xl overflow-hidden transition-all duration-300">
        
        <!-- Header com Logo da Andra -->
        <div class="bg-slate-50 border-b border-slate-100 p-8 text-center flex flex-col items-center">
            <img src="https://fluig.andra.com.br/volume/stream/Rmx1aWc=/P3Q9MSZ2b2w9RGVmYXVsdCZpZD04NTI3JnZlcj0xMDAwJmZpbGU9QU5EUkErJTI4MSUyOS5wbmcmY3JjPTE2OTA1NzMxMTQmc2l6ZT0wLjAzODc3NCZ1SWQ9MjgmZlNJZD0xJnVTSWQ9MSZkPWZhbHNlJnRrbj0mcHVibGljVXJsPXRydWUmYXR0YWNoPWZhbHNl.png" 
                 alt="Andra Logo" 
                 class="h-14 object-contain mb-6 drop-shadow-sm">
            <h1 class="text-2xl font-bold text-slate-800 tracking-tight">Geocodificador de CEP</h1>
            <p class="text-sm text-slate-500 mt-2 max-w-xl mx-auto">Insira uma lista de CEPs separados por vírgula ou por linha para descobrir a latitude e longitude exatas usando integração ViaCEP + OpenStreetMap.</p>
        </div>

        <div class="p-8">
            <div class="mb-6">
                <label for="cep-input" class="block text-sm font-semibold text-slate-700 mb-2">
                    Lista de CEPs
                </label>
                <textarea id="cep-input" 
                          rows="5" 
                          class="w-full p-4 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-shadow text-slate-700 placeholder-slate-400 resize-y" 
                          placeholder="Exemplo:&#10;01001-000, 22041-001&#10;70040-010"></textarea>
                <p id="error-msg" class="text-red-500 text-sm mt-2 hidden">Por favor, insira pelo menos um CEP válido.</p>
            </div>

            <!-- Botão de Ação -->
            <button id="search-btn" class="w-full sm:w-auto px-8 py-3 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-xl shadow-md hover:shadow-lg transition-all duration-200 flex items-center justify-center gap-2">
                <span id="btn-text">Buscar Coordenadas</span>
                <svg id="btn-spinner" class="animate-spin hidden h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
            </button>
        </div>

        <!-- Área de Resultados -->
        <div id="results-container" class="hidden border-t border-slate-100 bg-slate-50">
            <div class="p-8">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-lg font-semibold text-slate-800">Resultados</h3>
                    <div class="flex items-center gap-3">
                        <span id="progress-text" class="text-sm font-medium text-blue-600 bg-blue-100 px-3 py-1 rounded-full">0/0 concluídos</span>
                        <!-- Botão Exportar CSV -->
                        <button id="export-btn" class="hidden px-4 py-2 bg-emerald-500 hover:bg-emerald-600 text-white text-sm font-semibold rounded-lg shadow transition-colors flex items-center gap-2">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                            Exportar CSV
                        </button>
                    </div>
                </div>
                
                <div class="bg-white border border-slate-200 rounded-xl overflow-hidden shadow-sm table-container max-h-96 overflow-y-auto mb-6">
                    <table class="w-full text-left text-sm whitespace-nowrap">
                        <thead class="bg-slate-100 text-slate-600 font-medium sticky top-0 shadow-sm z-10">
                            <tr>
                                <th class="py-3 px-4 w-1/5">CEP</th>
                                <th class="py-3 px-4 w-1/5">Endereço Encontrado</th>
                                <th class="py-3 px-4 w-1/5">Latitude</th>
                                <th class="py-3 px-4 w-1/5">Longitude</th>
                                <th class="py-3 px-4 w-1/5 text-center">Status</th>
                            </tr>
                        </thead>
                        <tbody id="results-body" class="divide-y divide-slate-100">
                            <!-- Linhas preenchidas via JS -->
                        </tbody>
                    </table>
                </div>

                <!-- Mapa Interativo -->
                <div id="map-container" class="hidden border border-slate-200 rounded-xl overflow-hidden shadow-sm h-96 w-full relative z-0">
                    <div id="map" class="w-full h-full z-0"></div>
                </div>
            </div>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const inputElement = document.getElementById('cep-input');
            const searchBtn = document.getElementById('search-btn');
            const btnText = document.getElementById('btn-text');
            const btnSpinner = document.getElementById('btn-spinner');
            const errorMsg = document.getElementById('error-msg');
            const resultsContainer = document.getElementById('results-container');
            const resultsBody = document.getElementById('results-body');
            const progressText = document.getElementById('progress-text');
            const exportBtn = document.getElementById('export-btn');
            const mapContainer = document.getElementById('map-container');

            let map = null;
            let markersGroup = null;

            const initMap = () => {
                if (!map) {
                    map = L.map('map').setView([-14.2350, -51.9253], 4); // Centro do Brasil
                    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
                    }).addTo(map);
                    markersGroup = L.featureGroup().addTo(map);
                } else {
                    markersGroup.clearLayers();
                    map.setView([-14.2350, -51.9253], 4); // Reseta visão inicial
                }
                setTimeout(() => map.invalidateSize(), 100);
            };

            exportBtn.addEventListener('click', () => {
                let csv = 'CEP,Endereco,Latitude,Longitude,Status\n';
                const rows = resultsBody.querySelectorAll('tr');
                rows.forEach(row => {
                    const cols = row.querySelectorAll('td');
                    if (cols.length === 5) { 
                        const end = `"${cols[1].innerText}"`;
                        csv += `${cols[0].innerText},${end},${cols[2].innerText},${cols[3].innerText},${cols[4].innerText}\n`;
                    }
                });

                const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement("a");
                link.setAttribute("href", url);
                link.setAttribute("download", "coordenadas_ceps.csv");
                link.style.visibility = 'hidden';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            });

            const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));

            const getBadgeHTML = (text, type) => {
                const colors = {
                    'queue': 'bg-slate-100 text-slate-600',
                    'searching': 'bg-blue-100 text-blue-800 animate-pulse',
                    'success': 'bg-green-100 text-green-800',
                    'invalid': 'bg-orange-100 text-orange-800',
                    'not_found': 'bg-red-100 text-red-800',
                    'error': 'bg-red-100 text-red-800'
                };
                return `<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium ${colors[type]}">${text}</span>`;
            };

            searchBtn.addEventListener('click', async () => {
                const rawValue = inputElement.value;
                const ceps = rawValue
                    .split(/[\n,]+/)
                    .map(cep => cep.trim().replace(/\D/g, ''))
                    .filter(cep => cep.length === 8);

                if (ceps.length === 0) {
                    errorMsg.classList.remove('hidden');
                    return;
                }
                
                errorMsg.classList.add('hidden');
                
                searchBtn.disabled = true;
                searchBtn.classList.add('opacity-75', 'cursor-not-allowed');
                btnText.textContent = 'Processando...';
                btnSpinner.classList.remove('hidden');
                
                resultsContainer.classList.remove('hidden');
                exportBtn.classList.add('hidden'); 
                mapContainer.classList.remove('hidden'); 
                resultsBody.innerHTML = '';
                
                initMap(); 
                
                const rowElements = [];
                ceps.forEach(cep => {
                    const formattedCep = cep.replace(/^(\d{5})(\d{3})$/, "$1-$2");
                    const tr = document.createElement('tr');
                    tr.className = 'hover:bg-slate-50 transition-colors';
                    tr.innerHTML = `
                        <td class="py-3 px-4 font-medium text-slate-700">${formattedCep}</td>
                        <td class="py-3 px-4 text-slate-400 italic text-xs whitespace-normal min-w-[200px]">-</td>
                        <td class="py-3 px-4 text-slate-400 italic">-</td>
                        <td class="py-3 px-4 text-slate-400 italic">-</td>
                        <td class="py-3 px-4 text-center status-cell">${getBadgeHTML('Na fila', 'queue')}</td>
                    `;
                    resultsBody.appendChild(tr);
                    rowElements.push({ tr, cep: formattedCep, rawCep: cep });
                });

                for (let i = 0; i < rowElements.length; i++) {
                    const item = rowElements[i];
                    const row = item.tr;
                    const statusCell = row.querySelector('.status-cell');
                    
                    progressText.textContent = `${i + 1}/${rowElements.length} concluídos`;
                    statusCell.innerHTML = getBadgeHTML('Consultando...', 'searching');

                    try {
                        // 1. Busca no ViaCEP primeiro
                        const viaCepResponse = await fetch(`https://viacep.com.br/ws/${item.rawCep}/json/`);
                        const viaCepData = await viaCepResponse.json();

                        if (viaCepData.erro) {
                            statusCell.innerHTML = getBadgeHTML('CEP Inválido', 'invalid');
                            row.cells[1].textContent = "CEP não encontrado";
                        } else {
                            // --- MONTA ENDEREÇO VISUAL (Com Bairro) ---
                            const displayParts = [];
                            if (viaCepData.logradouro) displayParts.push(viaCepData.logradouro);
                            if (viaCepData.bairro) displayParts.push(viaCepData.bairro); // Mostra o bairro na tela
                            if (viaCepData.localidade) displayParts.push(viaCepData.localidade);
                            if (viaCepData.uf) displayParts.push(viaCepData.uf);
                            
                            const enderecoExibicao = displayParts.join(', ');
                            row.cells[1].textContent = enderecoExibicao;
                            row.cells[1].classList.remove('text-slate-400', 'italic');
                            row.cells[1].classList.add('text-slate-700');

                            // --- MONTA ENDEREÇO DE BUSCA (Sem Bairro para não dar falha no mapa) ---
                            const searchParts = [];
                            if (viaCepData.logradouro) searchParts.push(viaCepData.logradouro);
                            if (viaCepData.localidade) searchParts.push(viaCepData.localidade);
                            if (viaCepData.uf) searchParts.push(viaCepData.uf);
                            
                            const queryStr = searchParts.join(', ');
                            const encodedQuery = encodeURIComponent(queryStr);

                            // 2. Tenta buscar a rua e cidade
                            let nomResponse = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodedQuery}&countrycodes=br&limit=1`);
                            let nomData = await nomResponse.json();

                            // 3. FALLBACK: Se falhar por nome de rua divergente, tenta buscar puramente pelo CEP
                            if (!nomData || nomData.length === 0) {
                                const fallbackQuery = encodeURIComponent(item.rawCep);
                                const fallbackResponse = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${fallbackQuery}&countrycodes=br&limit=1`);
                                nomData = await fallbackResponse.json();
                            }

                            if (nomData && nomData.length > 0) {
                                const result = nomData[0];
                                
                                // Atualiza Latitude e Longitude
                                row.cells[2].textContent = result.lat;
                                row.cells[2].classList.remove('text-slate-400', 'italic');
                                row.cells[2].classList.add('text-slate-800');

                                row.cells[3].textContent = result.lon;
                                row.cells[3].classList.remove('text-slate-400', 'italic');
                                row.cells[3].classList.add('text-slate-800');

                                statusCell.innerHTML = getBadgeHTML('Encontrado', 'success');

                                const lat = parseFloat(result.lat);
                                const lon = parseFloat(result.lon);
                                const marker = L.marker([lat, lon]).bindPopup(`<b>CEP:</b> ${item.cep}<br><b>Endereço:</b> ${enderecoExibicao}`);
                                markersGroup.addLayer(marker);
                                
                                map.fitBounds(markersGroup.getBounds(), { padding: [30, 30], maxZoom: 15 });
                            } else {
                                statusCell.innerHTML = getBadgeHTML('Não Encontrado no Mapa', 'not_found');
                            }
                        }
                    } catch (error) {
                        console.error('Erro na requisição:', error);
                        statusCell.innerHTML = getBadgeHTML('Erro de Conexão', 'error');
                    }

                    // Atraso de 1.2s obrigatório do Nominatim
                    if (i < rowElements.length - 1) {
                        await sleep(1200);
                    }
                }

                // Finalização
                searchBtn.disabled = false;
                searchBtn.classList.remove('opacity-75', 'cursor-not-allowed');
                btnText.textContent = 'Buscar Coordenadas';
                btnSpinner.classList.add('hidden');
                
                progressText.classList.replace('text-blue-600', 'text-green-700');
                progressText.classList.replace('bg-blue-100', 'bg-green-100');
                progressText.textContent = 'Busca Concluída';
                
                exportBtn.classList.remove('hidden'); 
            });
        });
    </script>
</body>
</html>
